name: Validate and Deploy

on:
  push:
    branches:
      - master


concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: audit
        run: npm audit

      - name: Check required files
        run: |
          for f in Dockerfile fly.toml package.json server.js certs/prod-ca-2021.crt; do
            if [ ! -f "$f" ]; then
              echo "::error::Falta el archivo requerido: $f"
              exit 1
            fi
          done
          grep -q 'app = "passmanager-stripe-service"' fly.toml \
            || { echo "::error::fly.toml no apunta a passmanager-stripe-service"; exit 1; }

      - name: Syntax check
        run: |
          node --check server.js
          node --check instrument-sentry.js
          find handlers middlewares utils data router models queries -name '*.js' -print0 \
            | xargs -0 -n1 node --check

  deploy:
    name: Deploy to Fly.io
    needs: validate
    runs-on: ubuntu-latest
    environment: prod
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check FLY_API_TOKEN
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Falta FLY_API_TOKEN en el environment 'prod'."
            exit 1
          fi

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
